[package]
name = "yibao"
version = "1.0.6"
edition = "2021"
description = "蚂蚁哥医保查询 - 2027年度城乡居民医保征缴信息（原生 GUI 单文件版）"
authors = ["浦江蚂蚁哥 <shorver@163.com>"]

[[bin]]
name = "yibao"
path = "src/main.rs"

[dependencies]
egui = "0.31"
eframe = "0.31"
serde_json = "1"
regex = "1"
# egui 0.31 不内置图片解码器，logo PNG 需要它来解（见 src/main.rs PngLoader）
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 2
