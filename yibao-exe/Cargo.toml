[package]
name = "yibao"
version = "1.0.5"
edition = "2021"
description = "蚂蚁哥医保查询 - 2027年度城乡居民医保征缴信息（原生 GUI 单文件版）"
authors = ["浦江蚂蚁哥 <shorver@163.com>"]

[[bin]]
name = "yibao"
path = "src/main.rs"

[dependencies]
egui = "0.31"
eframe = "0.31"
serde_json = "1"
regex = "1"

[profile.release]
opt-level = 2
